<div rol="pantalla" class="w-auto h-auto">    
    <div id="contenedor-pantalla" class="w-auto h-auto min-vh-100 d-flex flex-column justify-content-between">
        <div class="contenido-Pantalla mb-5">  
            <div rol="vista" nombreVista="__Header"></div>
            <div class="espaciado-horizontal">
                <div rol="vista" nombreVista="__NavPaginaDIAN"></div>
            </div>
            <div class="espaciado-horizontal">
                <div rol="control" nombreControl="txtTitulo"></div>
            </div>
            <div class="espaciado-horizontal content-progress">
                <div class="progress" >
                    <div class="progress-bar" role="progressbar" style="width: 25%" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
            <div class="espaciado-horizontal">
                <div class="contenido-paso">
                    <div>
                        <div rol="control" nombreControl="txtPasoUno"></div>
                    </div>
                    <div>
                        <div rol="control" nombreControl="txtTipoPersona"></div>
                    </div>
                    <div class="w-100">
                        <div rol="control" nombreControl="TipoPersona"></div>
                    </div>

                    <div contenido="atencion" class="separador-contenido w-100 d-block"></div>
                    <div contenido="atencion">
                        <div rol="control" nombreControl="txtTipoAtencion"></div>
                    </div>
                    <div contenido="atencion">
                        <div rol="control" nombreControl="TipoAtencion"></div>
                    </div>        

                    <div contenido="categoria" class="separador-contenido w-100 d-block"></div>
                    <div contenido="categoria">
                        <div rol="control" nombreControl="txtCategoria"></div>
                    </div>
                    <div contenido="categoria" class="w-100">
                        <div rol="control" nombreControl="Categorias"></div>
                    </div>
                    <div contenido="servicio" class="contenido-form">
                        <div>
                            <div rol="control" nombreControl="txtServicio"></div>
                        </div>
                        <div>
                            <div rol="control" nombreControl="Servicios"></div>
                        </div>
                    </div>                      
                    <div class="contenido-botones">
                        <div rol="control" nombreControl="btnAnterior"></div>
                        <div contenido="botonesPasoUno" class="d-flex">
                            <div rol="control" nombreControl="btnSiguiente"></div>
                            <div rol="control" nombreControl="btnSiguienteBlock"></div>
                        </div>
                    </div>
                </div>
            </div>            
        </div>
        <div rol="vista" nombreVista="__Footer"></div>
    </div>
</div>
