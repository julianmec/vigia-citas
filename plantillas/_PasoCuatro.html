<div rol="pantalla" class="w-auto h-auto">    
    <div id="contenedor-pantalla" class="w-auto h-auto min-vh-100 d-flex flex-column justify-content-between">
        <div class="contenido-Pantalla mb-5">  
            <div rol="vista" nombreVista="__Header"></div>
            <div class="espaciado-horizontal">
                <div rol="vista" nombreVista="__NavPaginaDIAN"></div>
            </div>
            <div class="espaciado-horizontal">
                <div rol="control" nombreControl="txtTitulo"></div>
            </div>
            <div class="espaciado-horizontal content-progress">
                <div class="progress" >
                    <div class="progress-bar" role="progressbar" style="width: 100%" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
            <div class="espaciado-horizontal">
                <div class="contenido-paso">
                    <div>
                        <div rol="control" nombreControl="txtPasoCuatro"></div>
                    </div>
                    <div class="contenedor-info-paso">
                        <div class="contenido-info-paso">
                            <div rol="control" nombreControl="txtTituloPasoUno"></div>
                            <div class="info-paso">
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtTipoPersona"></div>
                                    <div rol="control" nombreControl="txtInfoTipoPersona"></div>
                                </div>
								<div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtTipoAtencion"></div>
                                    <div rol="control" nombreControl="txtInfoTipoAtencion"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtTipoServicio"></div>
                                    <div rol="control" nombreControl="txtInfoTipoServicio"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtServicio"></div>
                                    <div rol="control" nombreControl="txtInfoServicio"></div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div rol="control" nombreControl="btnEditarPasoUno"></div>
                        </div>
                    </div>                    
                    <div class="contenedor-info-paso">
                        <div class="contenido-info-paso">
                            <div rol="control" nombreControl="txtTituloPasoDos"></div>
                            <div class="info-paso">                                
                                <div contenido="ubicacion" class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtCiudad"></div>
                                    <div rol="control" nombreControl="txtInfoCiudad"></div>
                                </div>
                                <div contenido="ubicacion" class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtSede"></div>
                                    <div rol="control" nombreControl="txtInfoSede"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtFecha"></div>
                                    <div rol="control" nombreControl="txtInfoFecha"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtHora"></div>
                                    <div rol="control" nombreControl="txtInfoHora"></div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div rol="control" nombreControl="btnEditarPasoDos"></div>
                        </div>
                    </div>                    
                    <div class="contenedor-info-paso">
                        <div class="contenido-info-paso">
                            <div rol="control" nombreControl="txtTituloPasoTres"></div>
                            <div class="info-paso">
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtTipoDocumento"></div>
                                    <div rol="control" nombreControl="txtInfoTipoDocumento"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtNumeroDocumento"></div>
                                    <div rol="control" nombreControl="txtInfoNumeroDocumento"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtNombres"></div>
                                    <div rol="control" nombreControl="txtInfoNombres"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtTelefono"></div>
                                    <div rol="control" nombreControl="txtInfoTelefono"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtCorreo"></div>
                                    <div rol="control" nombreControl="txtInfoCorreo"></div>
                                </div>
                                <div contenido="infoDocCargados" class="d-flex gap-2">
                                    <div rol="control" nombreControl="txtDocumentos"></div>
                                    <div rol="control" nombreControl="txtInfoDocumentos"></div>
                                </div>
                            </div>
                        </div>
                        <div contenido="botonesPasoCuatro">
                            <div rol="control" nombreControl="btnEditarPasoTres"></div>
                            <div rol="control" nombreControl="btnEditarPasoTresBlock"></div>
                        </div>
                    </div>
                    <div class="tamanio-maximo-contenido">
                        <div class="separador-contenido w-100 d-block"></div>
                    </div>
                    <div contenido="botonesPasoCuatro" class="d-flex justify-content-center w-100">
                        <div rol="control" nombreControl="btnActualizarCita"></div>
                        <div rol="control" nombreControl="btnAgendarCita"></div>
                    </div>
                </div>
            </div>            
        </div>
        <div rol="vista" nombreVista="__Footer"></div>
    </div>
</div>
