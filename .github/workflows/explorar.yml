name: Explorar código de la página

# Descarga los scripts y plantillas públicos de la página de agendamiento para estudiarlos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['explorar/solicitud.txt']

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar página, scripts y plantillas
        run: |
          set -u
          B=https://agendamiento.dian.gov.co
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          mkdir -p out/js out/plantillas && cd out
          curl -sSL -A "$UA" "$B/" -o index.html
          grep -oE '(src|href)="[^"]+\.(js|css)[^"]*"|(src|href)="/bundles/[^"]+"' index.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > lista.txt
          cat lista.txt
          while read -r u; do
            case "$u" in http*) url="$u";; /*) url="$B$u";; *) url="$B/$u";; esac
            case "$url" in *agendamiento.dian.gov.co*) ;; *) continue;; esac
            f="js/$(echo "$u" | sed -E 's#^/##; s#[/?=&]#_#g' | cut -c1-120)"
            curl -sSL -A "$UA" "$url" -o "$f" || true
          done < lista.txt
          for p in _PasoUno _PasoDos _PasoTres _PasoCuatro _ModalArchivosAsociados _ModalInfoCita _ModalError _ModalSinCitas _Inicio; do
            curl -sSL -A "$UA" "$B/Recursos/CitasDIAN/Plantillas/$p.html" -o "plantillas/$p.html" || true
          done
          ls -la js plantillas
      - name: Publicar en la rama "explorar"
        run: |
          cd out
          git init -q -b explorar
          git config user.name "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Scripts y plantillas $(date -u +%F_%H%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" explorar
