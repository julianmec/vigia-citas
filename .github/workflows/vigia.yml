name: Vigía de citas DIAN

# Cada corrida revisa la DIAN una vez y deja programada la siguiente (cadena de ~5 min).
# El horario (schedule) solo sirve de respaldo para reiniciar la cadena si algún día se corta:
# GitHub ejecuta los horarios gratuitos con horas de retraso, por eso no se usa como reloj principal.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      forzar_aviso:
        description: 'Enviar un aviso de prueba (te llega por correo)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['vigia.js', 'package.json', '.github/workflows/vigia.yml', 'prueba-aviso.txt']

permissions:
  contents: write   # publicar capturas e historial en la rama "resultados"
  issues: write     # crear el aviso (GitHub te lo manda por correo)
  actions: write    # programar la siguiente revisión

concurrency:
  group: vigia-citas
  cancel-in-progress: false

env:
  AVISOS: 'on'          # 'off' para pausar los correos (y la alarma del iPhone) sin detener la revisión
  CIUDADES: 'Bogot'     # ciudades que te sirven (expresión regular)
  TRAMITE: 'vehiculo|electric|hibrid'   # tu trámite; el aviso solo suena si aparece en una de tus ciudades
  VUELTAS: '8'          # revisiones por corrida (los cupos duran pocos minutos)
  ESPERA_SEG: '15'      # segundos entre revisiones dentro de una corrida (cada una tarda ~10-30 s)
  PAUSA_MIN: '0'        # minutos de pausa entre corridas

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fin: ${{ steps.fin.outputs.t }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Revisar agenda (varias veces; se detiene apenas encuentra tu trámite)
        continue-on-error: true
        env:
          FORZAR_AVISO: ${{ inputs.forzar_aviso || (github.event_name == 'push' && contains(github.event.head_commit.message, '[aviso]')) }}
          EVENTO: ${{ github.event_name }}
        run: |
          : > lineas.csv
          for i in $(seq 1 "$VUELTAS"); do
            rm -rf salida
            timeout 210 node vigia.js || true
            [ -f salida/resumen.json ] || continue
            jq -r --arg ev "$EVENTO" \
              '[(now - 18000 | strftime("%Y-%m-%d %H:%M")), $ev, .veredicto, ((.ciudades // []) | join(" / "))] | @csv' \
              salida/resumen.json >> lineas.csv
            V=$(jq -r '.veredicto' salida/resumen.json)
            echo "Revisión $i: $V"
            [ "$V" = "posible-cita" ] && break
            [ "$FORZAR_AVISO" = "true" ] && break
            [ "$i" -lt "$VUELTAS" ] && sleep "$ESPERA_SEG"
          done
          true

      - name: Avisar por correo (issue de GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DUENO: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          [ -f salida/resumen.json ] || exit 0
          PREVIO=$( (git fetch -q origin resultados && git show FETCH_HEAD:resumen.json | jq -r '.veredicto // empty') 2>/dev/null || true)
          V=$(jq -r '.veredicto' salida/resumen.json)
          PRUEBA=$(jq -r '.prueba // false' salida/resumen.json)
          HORA=$(jq -r '.hora' salida/resumen.json)
          LUGAR=$(jq -r '(.ciudadesObjetivo // []) | join(", ")' salida/resumen.json)
          OTRAS=$(jq -r '(.ciudades // []) | join(", ")' salida/resumen.json)
          CAPTURAS="https://github.com/$REPO/tree/resultados"
          if [ "$PRUEBA" = "true" ]; then
            # El título contiene "Puede haber citas" para que también dispare la alarma del iPhone.
            TITULO="Puede haber citas DIAN - PRUEBA, no es real ($HORA)"
            CUERPO="@$DUENO Esto es una **prueba**: así te va a llegar el aviso cuando aparezca agenda. Resultado real de esta revisión: **$V**. Ciudades con agenda: ${OTRAS:-ninguna}."
          elif [ "$V" = "posible-cita" ] && [ "$AVISOS" = "on" ] && [ "$PREVIO" != "posible-cita" ]; then
            TITULO="🚨 Puede haber citas DIAN de devoluciones en ${LUGAR:-tu ciudad} ($HORA)"
            CUERPO="@$DUENO **Entra ya** a https://agendamiento.dian.gov.co y en Safari toca **••• → Marcadores → Cita DIAN**. En ~10 segundos te pide **No soy un robot**: tócalo y el botón agenda solo. Los cupos duran pocos minutos. Agenda en esta revisión: ${OTRAS:-no se pudo leer}."
          elif [ "$V" = "posible-cita" ] && [ "$AVISOS" = "on" ]; then
            # La agenda sigue abierta: hasta 3 recordatorios (uno por revisión) mientras el aviso siga abierto.
            N=$(gh issue list --repo "$REPO" --state open --json number,title \
              --jq '[.[] | select(.title | test("Puede haber citas")) | select(.title | test("PRUEBA") | not)][0].number // empty')
            [ -n "$N" ] || exit 0
            C=$(gh issue view "$N" --repo "$REPO" --json comments --jq '.comments | length')
            [ "$C" -lt 3 ] || exit 0
            printf '@%s Sigue habiendo agenda en %s (%s). Entra ya: Safari → ••• → Marcadores → Cita DIAN.\n' "$DUENO" "${LUGAR:-tu ciudad}" "$HORA" > comentario.md
            gh issue comment "$N" --repo "$REPO" --body-file comentario.md
            exit 0
          else
            exit 0
          fi
          printf '%s\n\nCapturas de la revisión: %s\n' "$CUERPO" "$CAPTURAS" > cuerpo.md
          gh issue create --repo "$REPO" --title "$TITULO" --body-file cuerpo.md

      - name: Publicar capturas e historial (rama "resultados")
        id: publicar
        if: always()
        run: |
          [ -f salida/resumen.json ] || exit 0
          PREVIO=""
          if git fetch -q origin resultados 2>/dev/null; then
            PREVIO=$(git show FETCH_HEAD:resumen.json 2>/dev/null | jq -r '.veredicto // empty' || true)
            git show FETCH_HEAD:historial.csv > salida/historial.csv 2>/dev/null || true
          fi
          [ -s salida/historial.csv ] || echo "hora_bogota,evento,veredicto,ciudades" > salida/historial.csv
          cat lineas.csv >> salida/historial.csv 2>/dev/null || true
          { head -n 1 salida/historial.csv; tail -n +2 salida/historial.csv | tail -n 3000; } > h.tmp && mv h.tmp salida/historial.csv
          echo "previo=$PREVIO" >> "$GITHUB_OUTPUT"
          cd salida
          git init -q -b resultados
          git config user.name "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Corrida ${{ github.run_number }} (${{ github.event_name }})"
          for i in 1 2 3; do git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultados && break; sleep 5; done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: fin
        if: always()
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

  siguiente:
    needs: revisar
    if: always() && vars.CADENA != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Si el ambiente "espera" tiene "Wait timer", GitHub espera sin gastar minutos; si no, se espera aquí.
    environment: espera
    steps:
      - name: Esperar y programar la siguiente revisión
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FIN: ${{ needs.revisar.outputs.fin }}
        run: |
          FIN=${FIN:-$(date +%s)}
          FALTA=$(( PAUSA_MIN * 60 - ( $(date +%s) - FIN ) ))
          [ "$FALTA" -gt 0 ] && sleep "$FALTA"
          for i in 1 2 3 4 5; do
            gh workflow run vigia.yml --repo "$REPO" --ref main && exit 0
            sleep 20
          done
          exit 1
